services:
  # 1. PostgreSQL Database Container
  postgres:
    image: postgres:15-alpine
    container_name: medgenesis-postgres
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-123456}
      POSTGRES_DB: ${PGDATABASE:-medgenesis}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - medgenesis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medgenesis-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=medgenesis_secret_key_2026
      - PGHOST=postgres
      - PGUSER=postgres
      - PGPASSWORD=123456
      - PGDATABASE=medgenesis
      - PGPORT=5432
      - RAG_SERVICE_URL=http://rag-service:8000/api/analyze
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_started
    networks:
      - medgenesis-network

  # 3. FastAPI Python RAG Microservice
  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: medgenesis-rag
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./rag-service/chroma_db:/app/chroma_db
    networks:
      - medgenesis-network

  # 4. React Frontend (Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medgenesis-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - medgenesis-network

networks:
  medgenesis-network:
    driver: bridge

volumes:
  postgres_data: {}